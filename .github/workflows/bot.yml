name: Ucuzcum Bot

on:
  schedule:
    # 4 saatte bir: gunde 6 tur. Actions ucretsiz sinirinin altinda kalir.
    - cron: '0 */6 * * *'
  workflow_dispatch:

# Bir tur bitmeden ikincisi baslamasin
concurrency:
  group: ucuzcum-bot
  cancel-in-progress: false

jobs:
  fiyat-kontrol:
    runs-on: ubuntu-latest
    steps:
      - name: Kodu al
        uses: actions/checkout@v4

      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Kutuphaneleri kur
        run: pip install google-auth requests

      - name: Botu calistir
        env:
          FIREBASE_URL: ${{ secrets.FIREBASE_URL }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          WEB_TOKEN: ${{ secrets.WEB_TOKEN }}
        run: python bot.py
