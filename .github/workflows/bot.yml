name: Ucuzcum Bot

on:
  schedule:
    # Saatte bir, saat basindan 7 dakika sonra. GitHub saat basindaki
    # (:00) zamanlanmis isleri yogunlukta erteleyip atliyor; kaydirildi.
    # Bir tur ~40 dk suruyor, daha sik yapmak isler ust uste binmesine yol acar.
    # Depo herkese acik: Actions dakikalari ucretsiz.
    - cron: '7 * * * *'
  workflow_dispatch:

# Bir tur bitmeden ikincisi baslamasin
concurrency:
  group: ucuzcum-bot
  cancel-in-progress: false

jobs:
  fiyat-kontrol:
    runs-on: ubuntu-latest
    steps:
      - name: Kodu al
        uses: actions/checkout@v4

      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Kutuphaneleri kur
        run: pip install google-auth requests

      - name: Botu calistir
        env:
          FIREBASE_URL: ${{ secrets.FIREBASE_URL }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          WEB_TOKEN: ${{ secrets.WEB_TOKEN }}
        run: python bot.py
